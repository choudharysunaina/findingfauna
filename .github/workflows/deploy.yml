name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Blog posts live in a Google Sheet and are snapshotted into the bundle at
  # build time (scripts/fetch-blog.mjs), so a new sheet row only goes live on a
  # build. This nightly run means "add a row to publish" still works, with at
  # most a day's delay — or trigger "Run workflow" above to publish immediately.
  schedule:
    - cron: '30 20 * * *' # 02:00 IST daily

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # Fails the deploy on duplicate titles/canonicals, over-long or repeated
      # meta descriptions, placeholder values, missing alt text or broken
      # JSON-LD in the prerendered output.
      - name: Check SEO invariants
        run: npm run check:seo

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

